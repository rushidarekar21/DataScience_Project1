<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Quality Prediction</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="page-content">
        <div class="form-v9-content">
            <form class="form-detail" action="/predict" method="post">
                <h2>Wine Quality Prediction</h2>
                
                <div class="form-row-total">
                    <div class="form-row">
                        <label for="fixed_acidity">Fixed Acidity:</label>
                        <input type="text" name="fixed_acidity" id="fixed_acidity" class="input-text" placeholder="Enter fixed acidity value" required>
                    </div>

                    <div class="form-row">
                        <label for="volatile_acidity">Volatile Acidity:</label>
                        <input type="text" name="volatile_acidity" id="volatile_acidity" class="input-text" placeholder="Enter volatile acidity value" required>
                    </div>
                </div>

                <div class="form-row-total">
                    <div class="form-row">
                        <label for="citric_acid">Citric Acid:</label>
                        <input type="text" name="citric_acid" id="citric_acid" class="input-text" placeholder="Enter citric acid value" required>
                    </div>

                    <div class="form-row">
                        <label for="residual_sugar">Residual Sugar:</label>
                        <input type="text" name="residual_sugar" id="residual_sugar" class="input-text" placeholder="Enter residual sugar value" required>
                    </div>
                </div>

                <div class="form-row-total">
                    <div class="form-row">
                        <label for="chlorides">Chlorides:</label>
                        <input type="text" name="chlorides" id="chlorides" class="input-text" placeholder="Enter chlorides value" required>
                    </div>

                    <div class="form-row">
                        <label for="free_sulfur_dioxide">Free Sulfur Dioxide:</label>
                        <input type="text" name="free_sulfur_dioxide" id="free_sulfur_dioxide" class="input-text" placeholder="Enter free sulfur dioxide value" required>
                    </div>
                </div>

                <div class="form-row-total">
                    <div class="form-row">
                        <label for="total_sulfur_dioxide">Total Sulfur Dioxide:</label>
                        <input type="text" name="total_sulfur_dioxide" id="total_sulfur_dioxide" class="input-text" placeholder="Enter total sulfur dioxide value" required>
                    </div>

                    <div class="form-row">
                        <label for="density">Density:</label>
                        <input type="text" name="density" id="density" class="input-text" placeholder="Enter density value" required>
                    </div>
                </div>

                <div class="form-row-total">
                    <div class="form-row">
                        <label for="pH">pH:</label>
                        <input type="text" name="pH" id="pH" class="input-text" placeholder="Enter pH value" required>
                    </div>

                    <div class="form-row">
                        <label for="sulphates">Sulphates:</label>
                        <input type="text" name="sulphates" id="sulphates" class="input-text" placeholder="Enter sulphates value" required>
                    </div>
                </div>

                <div class="form-row-total">
                    <div class="form-row">
                        <label for="alcohol">Alcohol:</label>
                        <input type="text" name="alcohol" id="alcohol" class="input-text" placeholder="Enter alcohol percentage" required>
                    </div>
                </div>

                <div class="form-row-last">
                    <input type="submit" name="register" class="register" value="Predict Wine Quality">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
